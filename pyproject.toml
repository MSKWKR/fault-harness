[project]
name = "fault-harness"
version = "0.1.0"
description = "A test harness towards redis"
readme = "README.md"
authors = [
    { name = "MSKWKR", email = "andrewwang0528@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "fault: Destructive tests that stop and restart Redis.",
]

testpaths = ["tests"]
addopts = "--strict-markers"